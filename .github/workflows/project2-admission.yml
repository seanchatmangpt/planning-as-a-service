name: Project2 exact-subject admission

on:
  pull_request:
    paths:
      - 'server/mcp/project2_admission.py'
      - 'server/mcp/test_project2_admission.py'
      - '.github/workflows/project2-admission.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Execute exact-subject admission falsifiers
        working-directory: server/mcp
        run: python -m unittest -v test_project2_admission.py
